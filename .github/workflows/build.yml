name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  linux:
    name: Linux (headless smoke test)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y ninja-build
      - name: Configure
        run: cmake -B build -G Ninja -DMZM_HOST=headless -DCMAKE_BUILD_TYPE=RelWithDebInfo
      - name: Build
        run: cmake --build build
      - name: Smoke test (no game data)
        # Boots the engine on a zero-filled image for 3000 frames and presses a
        # few buttons. Catches crashes in the port layer; it can't check visuals.
        run: |
          head -c 8388608 /dev/zero > zero.gba
          MZM_DEV_SKIP_ROM_CHECK=1 ./build/mzm_headless --rom zero.gba --frames 3000 --dump-every 0 \
            --press 400:S:5 --press 700:A:5 --press 900:A:5

  android:
    name: Android APK
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Build APK
        working-directory: android
        run: ./gradlew --no-daemon assembleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: mzm-android-apk
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
